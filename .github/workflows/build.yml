name: Java CI with Maven

#pipeline starts on every push or pull_request
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Java
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      # project compilation
      - name: Compile project
        run: mvn compile

      # Unit tests execution
      - name: Unit Test
        run: mvn test

      # Static analysis
      - name: Checkstyle
        run: mvn checkstyle:check
